<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>빅분기 실기 연습장</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="문제 목록">☰</button>
    <a class="brand" href="#/">빅분기 실기 연습장</a>
    <div class="progress-wrap" title="해결한 문제 수">
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <span id="progressText">0 / 0</span>
    </div>
    <span class="py-status loading" id="pyStatus"><span class="dot"></span><span id="pyStatusText">파이썬 준비 중…</span></span>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav id="problemList"></nav>
      <div class="side-footer">
        <button class="btn small ghost" id="exportBtn">진도 내보내기</button>
        <label class="btn small ghost">진도 불러오기<input type="file" id="importInput" accept=".json" hidden></label>
        <button class="btn small ghost danger" id="resetAllBtn">전체 초기화</button>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
